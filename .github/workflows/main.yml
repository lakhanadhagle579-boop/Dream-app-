name: Build DREAM AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p dream_project
          unzip -q DREAM_Android_Project.zip -d dream_project

      - name: Find Gradle Project
        run: |
          GRADLEW=$(find dream_project -name gradlew -type f | head -1)
          echo "GRADLEW=$GRADLEW"
          chmod +x "$GRADLEW"

      - name: Build AAB
        run: |
          GRADLEW=$(find dream_project -name gradlew -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DREAM-AAB
          path: dream_project/**/build/outputs/bundle/release/*.aab
          
