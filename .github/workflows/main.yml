name: Build DREAM AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          unzip -q DREAM_Android_Project_v9.zip -d dream_project

      - name: Check ZIP Contents
        run: |
         echo "===== ZIP CONTENTS ====="
         unzip -l DREAM_Android_Project_v9.zip
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
        gradle-version: '8.7'

      - name: Build AAB
        run: |
         cd dream_project/DREAM_Android_Project_v9
         gradle bundleRelease --no-daemon

       - name: Upload AAB
         uses: actions/upload-artifact@v4
         with:
         name: DREAM-AAB
         path: 'dream_project/**/build/outputs/bundle/release/*.aab'
          
