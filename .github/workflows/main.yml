           
name: Build DREAM AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        run: |
          mkdir -p dream_project
          unzip -q DREAM_Android_Project_v9.zip -d dream_project

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> dream_project/DREAM_Android_Project_v9/gradle.properties
          echo "android.enableJetifier=true" >> dream_project/DREAM_Android_Project_v9/gradle.properties

      - name: Build AAB
        run: |
          BUILD_FILE=$(find dream_project -name build.gradle -type f | head -1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          gradle bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DREAM-AAB
          path: dream_project/**/build/outputs/bundle/release/*.aab
